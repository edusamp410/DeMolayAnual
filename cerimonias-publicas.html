<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CTR | Cerimônias Públicas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <div>
          <h1 class="header-title">Cerimônias públicas</h1>
        </div>
        <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
          <span id="roleBadge" class="badge">membro</span>
          <button class="secondary-btn" type="button" onclick="window.location.href='perfil.html'">Voltar</button>
          <button class="secondary-btn" type="button" onclick="logout()">Sair</button>
        </div>
      </header>

      <section class="card profile-card">
        <h2 id="userName">Carregando...</h2>
        <p class="subtitle">Conteúdo público. Apenas administradores podem alterar e enviar arquivos.</p>
      </section>

      <section class="card admin-panel">
        <div id="cerimoniasList"></div>

        <div id="cerimoniasAdminControls" style="display: none; margin-top: 24px;">
          <h3>Nova cerimônia pública</h3>

          <div class="form-group">
            <label for="cerimoniaTitulo">Título</label>
            <input id="cerimoniaTitulo" type="text" placeholder="Ex.: Cerimônia de acolhimento" />
          </div>

          <div class="form-group">
            <label for="cerimoniaDescricao">Descrição</label>
            <textarea id="cerimoniaDescricao" rows="4" style="width:100%; border-radius:10px; background:#1f2630; color:#fff; border:1px solid rgba(255,255,255,0.09); padding:12px 14px;"></textarea>
          </div>

          <div class="form-group">
            <label for="cerimoniaArquivo">Upload de arquivo</label>
            <input id="cerimoniaArquivo" type="file" />
          </div>

          <button id="addCerimoniaBtn" class="primary-btn" type="button" style="width: auto;">Salvar cerimônia</button>
        </div>
      </section>
    </main>

    <script src="roles.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const currentUser = requireAuth();
        if (!currentUser) return;

        const roleBadge = document.getElementById('roleBadge');
        const userName = document.getElementById('userName');
        const cerimoniasList = document.getElementById('cerimoniasList');
        const cerimoniasAdminControls = document.getElementById('cerimoniasAdminControls');
        const usuarioEhAdmin = isAdmin(currentUser);

        roleBadge.textContent = currentUser.papel;
        roleBadge.classList.toggle('admin', usuarioEhAdmin);
        userName.textContent = currentUser.nome;

        seedCalendarAndCeremonies();

        function renderCerimonias() {
          const items = getCerimoniasPublicas();
          if (!items.length) {
            cerimoniasList.innerHTML = '<p class="subtitle">Nenhuma cerimônia pública cadastrada.</p>';
            return;
          }

          cerimoniasList.innerHTML = items.map((item) => `
            <div class="card" style="padding: 18px; margin-bottom: 14px; background: rgba(255,255,255,0.02);">
              <strong>${item.titulo}</strong>
              <p class="subtitle" style="margin: 10px 0;">${item.descricao || 'Sem descrição.'}</p>
              <small>${new Date(item.data).toLocaleString('pt-BR')}</small>
              ${item.arquivo ? `<div style="margin-top: 12px;"><a href="${item.arquivo}" target="_blank" class="primary-btn" style="display:inline-block; width:auto; text-decoration:none;">Abrir arquivo</a></div>` : ''}
              ${usuarioEhAdmin ? `<div style="margin-top: 12px;"><button class="secondary-btn" type="button" data-remove-cerimonia="${item.id}" style="width:auto;">Remover</button></div>` : ''}
            </div>
          `).join('');

          cerimoniasList.querySelectorAll('[data-remove-cerimonia]').forEach((button) => {
            button.addEventListener('click', () => {
              const id = button.getAttribute('data-remove-cerimonia');
              removeCerimoniaPublica(id);
              renderCerimonias();
            });
          });
        }

        renderCerimonias();

        if (usuarioEhAdmin) {
          cerimoniasAdminControls.style.display = 'block';

          document.getElementById('addCerimoniaBtn').addEventListener('click', () => {
            const titulo = document.getElementById('cerimoniaTitulo').value.trim();
            const descricao = document.getElementById('cerimoniaDescricao').value.trim();
            const arquivoInput = document.getElementById('cerimoniaArquivo');
            const arquivo = arquivoInput.files && arquivoInput.files[0] ? URL.createObjectURL(arquivoInput.files[0]) : '';

            if (!titulo) {
              alert('Informe o título da cerimônia.');
              return;
            }

            addCerimoniaPublica({
              id: `cer-${Date.now()}`,
              titulo,
              descricao,
              arquivo,
              data: new Date().toISOString()
            });

            document.getElementById('cerimoniaTitulo').value = '';
            document.getElementById('cerimoniaDescricao').value = '';
            arquivoInput.value = '';
            renderCerimonias();
          });
        }
      });
    </script>
  </body>
</html>
